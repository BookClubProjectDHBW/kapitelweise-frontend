<header>
  <nav class="navbar bg-white border-bottom shadow-sm">
    <div class="container py-2">
      <a class="navbar-brand serif fs-4" routerLink="/clubs">Kapitelweise</a>
      <button class="btn btn-outline-secondary" id="logoutButton" type="button" (click)="logout()">Logout</button>
    </div>
  </nav>
</header>

<main class="container py-5">
  <section class="mb-4">
    <h1 class="serif h2 mb-1">Hallo <span id="username">{{ homepage.username() }}</span> – was liest du heute?</h1>
    <p class="text-secondary mb-0">Öffne einen deiner Buchclubs oder nimm eine Einladung an.</p>
  </section>

  <div class="card shadow-sm">
    <div class="card-header bg-white d-flex flex-wrap gap-3 justify-content-between align-items-center">
      <ul class="nav nav-underline-custom serif fs-4">
        <li class="nav-item">
          <a class="nav-link" routerLink="/clubs" routerLinkActive="active">Meine Clubs</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/einladungen" routerLinkActive="active">Meine Einladungen</a>
        </li>
      </ul>
    </div>

    <div class="card-body p-4">
      @if (homepage.loading()) {
        <p class="text-secondary">Homepage wird geladen...</p>
      }
      @if (homepage.error()) {
        <div class="alert alert-danger" role="alert">{{ homepage.error() }}</div>
      }
      <router-outlet />
    </div>
  </div>
</main>

<footer>
  <div class="container"><p class="mb-0">© 2026 Kapitelweise</p></div>
</footer>
