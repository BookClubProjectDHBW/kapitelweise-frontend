<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Kapitelweise - Meine Clubs</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/homePage.css" />
    <script src="../js/homePage.js" defer></script>
  </head>
  <body>
    <header>
      <nav class="navbar bg-white border-bottom shadow-sm">
        <div class="container py-2">
          <a class="navbar-brand serif fs-4" href="homePage.html">
            Kapitelweise
          </a>

          <button
            type="button"
            class="btn btn-outline-secondary"
            id="logoutButton"
          >
            Logout
          </button>
        </div>
      </nav>
    </header>

    <main class="container py-5">
      <section class="mb-4">
        <h1 class="serif h2 mb-1">
          Hallo <span id="username"></span> – was liest du heute?
        </h1>

        <p class="text-secondary mb-0">
          Öffne einen deiner Buchclubs oder nimm eine Einladung an.
        </p>
      </section>

      <div class="card shadow-sm">
        <div
          class="card-header bg-white d-flex justify-content-between align-items-center"
        >
          <ul class="nav nav-underline-custom serif fs-4">
            <li class="nav-item">
              <button
                class="nav-link active"
                data-bs-toggle="tab"
                data-bs-target="#clubs-pane"
                type="button"
              >
                Meine Clubs
              </button>
            </li>

            <li class="nav-item">
              <button
                class="nav-link"
                data-bs-toggle="tab"
                data-bs-target="#invites-pane"
                type="button"
              >
                Meine Einladungen
              </button>
            </li>
          </ul>

          <button
            type="button"
            class="btn link-accent serif fs-5"
            data-bs-toggle="modal"
            data-bs-target="#createClubModal"
          >
            + Club erstellen
          </button>
        </div>

        <div class="card-body p-4 tab-content">
          <section class="tab-pane fade show active" id="clubs-pane">
            <div id="clubList" class="d-flex flex-column gap-3"></div>
          </section>

          <section class="tab-pane fade" id="invites-pane">
            <div id="inviteList" class="d-flex flex-column gap-3"></div>
          </section>
        </div>
      </div>
    </main>
    <div
      class="modal fade"
      id="createClubModal"
      tabindex="-1"
      aria-labelledby="createClubModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content"></div>
      </div>
    </div>
    <footer>
      <div class="container">
        <p class="mb-0">© 2026 Kapitelweise</p>
      </div>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
