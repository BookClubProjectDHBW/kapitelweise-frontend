<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kapitelweise - Anmelden</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <main class="auth-main">
      <div class="auth-container">
        <div class="auth-card">
          <h1 class="auth-title serif">Kapitelweise</h1>

          <p class="auth-subtitle">Gemeinsam wählen, lesen und diskutieren.</p>

          <div id="registered" class="alert alert-success d-none" role="alert">
            Registrierung erfolgreich! Du kannst dich jetzt anmelden.
          </div>

          <form id="loginForm" class="auth-form">
            <div class="mb-3">
              <label for="username" class="form-label">Benutzername:</label>
              <input
                type="text"
                class="form-control"
                id="username"
                name="username"
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Passwort:</label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                required
              />
            </div>

            <div
              id="loginError"
              class="alert alert-danger d-none"
              role="alert"
            ></div>

            <button type="submit" class="btn btn-confirm">Anmelden</button>

            <div class="auth-footer">
              <p>
                Noch kein Konto?
                <a class="auth-link-secondary" href="register.html">
                  Hier registrieren
                </a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script type="module" src="../js/pages/login.js"></script>
  </body>
</html>
