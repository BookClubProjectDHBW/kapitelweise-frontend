<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Name des Buchclubs</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/bookClub.css" />
    <script src="../js/bookClubMockData.js" defer></script>
    <script src="../js/bookClub.js" defer></script>
  </head>
  <body>
    <header>
      <nav class="navbar bg-white border-bottom shadow-sm">
        <div class="container py-2">
          <a class="navbar-brand fs-4" href="homePage.html">Buchclub</a>

          <button
            type="button"
            class="btn btn-outline-secondary"
            id="logoutButton"
          >
            Logout
          </button>
        </div>
      </nav>
    </header>
    <main class="container py-5">
      <section class="bookclub-header">
        <a href="homePage.html" class="back-link"> ← Zurück </a>
        <div class="bookclub-info">
          <img id="bookCover" alt="Buchcover" class="book-cover" />
          <div class="book-details">
            <p class="club-name">
              <span id="name">Buchclub</span>·<span id="memberCount"
                >AnzahlMitglieder</span
              >
              Mitglieder
            </p>
            <h1 id="title">Buchtitel</h1>
            <p class="book-data">
              <span id="edition">Ausgabe</span> · ISBN:
              <span id="isbn">ISBN</span> · Ziel:
              <span id="targetDate">Leseziel</span> Seiten
            </p>
          </div>
        </div>
      </section>
      <nav
        id="bookclubNavigation"
        class="bookclub-navigation"
        aria-label="Buchclub Navigation"
      >
        <button class="nav-tab active" type="button">Leseplan</button>

        <button class="nav-tab" type="button">Abstimmung</button>

        <button class="nav-tab" type="button">Treffen</button>

        <button class="nav-tab" type="button">Mitglieder</button>
      </nav>
    </main>
    <footer>
      <div class="container">
        <p class="mb-0">© 2026 Kapitelweise</p>
      </div>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
