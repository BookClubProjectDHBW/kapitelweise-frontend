
<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kapitelweise - Registrierung</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <main class="auth-main">
      <div class="auth-container">
        <div class="auth-card">
          <h1 class="auth-title serif">Kapitelweise</h1>

          <p class="auth-subtitle">
            Gemeinsam wählen, lesen und diskutieren.
          </p>

          <form id="registerForm" class="auth-form">
            <div class="mb-3">
              <label for="username" class="form-label">Benutzername:</label>
              <input
                type="text"
                class="form-control"
                id="username"
                name="username"
                required
              />
              <div id="usernameError" class="invalid-feedback">
                Der Benutzername ist bereits vergeben.
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Passwort:</label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                required
              />
              <div class="invalid-feedback">
                Dein Passwort muss mindestens 10 Zeichen lang sein.
              </div>
            </div>

            <div class="mb-3">
              <label for="confirmPassword" class="form-label">
                Passwort bestätigen:
              </label>
              <input
                type="password"
                class="form-control"
                id="confirmPassword"
                name="confirmPassword"
                required
              />
              <div class="invalid-feedback">
                Die Passwörter stimmen nicht überein.
              </div>
            </div>

            <div
              id="registerError"
              class="alert alert-danger d-none"
              role="alert"
            ></div>

            <button class="btn btn-confirm mt-3" type="submit">
              Registrieren
            </button>

            <p class="mt-3">
              Du hast bereits ein Konto?
              <a href="loginPage.html">Hier einloggen</a>
            </p>
          </form>
        </div>
      </div>
    </main>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script type="module" src="../js/pages/register.js"></script>
  </body>
</html>
